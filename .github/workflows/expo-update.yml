name: Publish Expo update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expo-update.yml"
      - "App.tsx"
      - "app.json"
      - "assets/**"
      - "babel.config.js"
      - "package-lock.json"
      - "package.json"
      - "src/**"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: expo-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish production update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Publish Expo production update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --branch production --message "GitHub ${GITHUB_SHA::7}" --non-interactive
